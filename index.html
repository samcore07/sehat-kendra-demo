<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="SEHAT KENDRA — National Digital Health Intake & Clinical Records Platform. Secure, ABDM-compliant patient portal for the Government of India." />
  <meta name="keywords" content="SEHAT KENDRA, ABDM, ABHA, digital health, Ayushman Bharat, national health, India government health portal" />
  <meta name="author" content="National Health Authority, Government of India" />
  <meta name="theme-color" content="#0072B8" />

  <!-- Open Graph -->
  <meta property="og:title" content="SEHAT KENDRA — National Digital Health Portal" />
  <meta property="og:description" content="Your unified health records, prescriptions, and appointments in one ABDM-compliant platform." />
  <meta property="og:type" content="website" />

  <title>SEHAT KENDRA — National Digital Health Intake &amp; Clinical Records</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts: Inter (Latin) + Noto Sans Devanagari (Hindi) + Noto Sans Bengali -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Material Symbols Outlined (variable font) -->
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet"
  />

  <!--
    No-flash theme initialisation — runs before React hydrates.
    Reads localStorage and applies data-theme to <html> immediately
    to prevent light/dark flash on load.
  -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('sk-theme') || 'system';
        var effective = saved === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : saved;
        document.documentElement.setAttribute('data-theme', effective);
        if (localStorage.getItem('sk-contrast') === '1') {
          document.documentElement.setAttribute('data-contrast', 'high');
        }
      } catch (e) { /* ignore — localStorage may be unavailable */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
